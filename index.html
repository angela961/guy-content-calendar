<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guy Pistone — Content Calendar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F1F5F9;color:#1E293B;padding:16px;min-height:100vh}
.page-title{font-size:17px;font-weight:700;color:#0A1F44;margin-bottom:2px}
.page-sub{font-size:11px;color:#64748B;margin-bottom:10px;line-height:1.5}
.sync-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sync-status{font-size:11px;padding:4px 12px;border-radius:20px;font-weight:600}
.sync-status.ok{background:#DCFCE7;color:#166534}
.sync-status.loading{background:#FEF9C3;color:#854D0E}
.sync-status.error{background:#FEE2E2;color:#991B1B}
.btn-sync{font-size:11px;padding:4px 12px;border-radius:20px;border:0.5px solid #CBD5E1;background:#fff;cursor:pointer;color:#475569;font-family:Arial,sans-serif}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
@media(min-width:500px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:0.5px solid #E2E8F0;border-radius:10px;padding:10px 14px}
.stat-n{font-size:20px;font-weight:700;color:#0A1F44}
.stat-l{font-size:10px;color:#64748B;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:#475569;background:#fff;padding:3px 8px;border-radius:20px;border:0.5px solid #E2E8F0}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.top-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.nav-btn{font-size:12px;padding:7px 14px;cursor:pointer;border-radius:8px;border:0.5px solid #CBD5E1;background:#fff;color:#1E293B;font-family:Arial,sans-serif}
.month-label{font-size:15px;font-weight:700;color:#0A1F44;flex:1;text-align:center}
.reset-btn{font-size:11px;padding:6px 12px;cursor:pointer;border-radius:8px;border:0.5px solid #CBD5E1;background:#fff;color:#64748B;font-family:Arial,sans-serif}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:20px}
.day-hdr{font-size:10px;font-weight:700;color:#94A3B8;text-align:center;padding:5px 0;letter-spacing:0.04em}
.day-hdr.posting{color:#185FA5}
.day-cell{border:0.5px solid #E2E8F0;border-radius:8px;padding:5px;min-height:80px;background:#fff;display:flex;flex-direction:column;gap:3px}
@media(min-width:500px){.day-cell{min-height:95px;padding:7px}}
.day-cell.off-day{background:transparent;border-color:transparent}
.day-cell.posting-day{border-color:#BFDBFE;cursor:pointer}
.day-cell.posting-day:hover{border-color:#3B82F6}
.day-cell.has-content{border-color:transparent}
.day-num{font-size:10px;font-weight:700;color:#CBD5E1}
.day-num.active-num{color:#475569}
.day-num.today-circle{background:#185FA5;color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:9px}
.slot{border-radius:6px;padding:4px 6px;cursor:pointer;flex:1;overflow:hidden}
.slot-pillar{font-size:8px;font-weight:700;letter-spacing:0.03em;margin-bottom:2px}
.slot-copy{font-size:9px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;opacity:0.85}
.slot-channels{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap}
.slot-ch{font-size:8px;padding:1px 4px;border-radius:8px;background:rgba(255,255,255,0.5);font-weight:700}
.add-btn{font-size:9px;color:#CBD5E1;cursor:pointer;padding:3px 1px;margin-top:auto}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0}
@media(min-width:600px){.overlay{align-items:center;padding:16px}}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:92vh;overflow-y:auto}
@media(min-width:600px){.modal{border-radius:16px;max-width:560px}}
.modal-header{padding:16px 20px 14px;border-bottom:0.5px solid #F1F5F9;position:sticky;top:0;background:#fff;z-index:1}
.modal-date-label{font-size:11px;font-weight:700;color:#185FA5;margin-bottom:2px;letter-spacing:0.04em;text-transform:uppercase}
.modal-heading{font-size:16px;font-weight:700;color:#0A1F44}
.modal-body{padding:16px 20px}
.sec-label{font-size:10px;font-weight:700;color:#94A3B8;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;margin-top:18px}
.sec-label:first-child{margin-top:0}
.pillar-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pb{font-size:11px;padding:8px 10px;border-radius:8px;border:1.5px solid #E2E8F0;cursor:pointer;background:#fff;color:#475569;font-family:Arial,sans-serif;text-align:left;font-weight:600;line-height:1.3;width:100%}
.pb:hover{border-color:#93C5FD;background:#F0F9FF}
.pb.sel{font-weight:700}
.copy-area{width:100%;border:1.5px solid #E2E8F0;border-radius:8px;padding:10px 12px;font-size:13px;font-family:Arial,sans-serif;color:#1E293B;resize:vertical;min-height:100px;line-height:1.6;margin-top:8px}
.copy-area:focus{outline:none;border-color:#3B82F6}
.copy-area::placeholder{color:#CBD5E1}
.char-count{font-size:10px;color:#94A3B8;text-align:right;margin-top:3px}
.ch-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#F8FAFC;border-radius:10px;padding:10px 12px;border:0.5px solid #E2E8F0;margin-bottom:8px;flex-wrap:wrap}
.ch-info{display:flex;align-items:center;gap:8px}
.ch-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.ch-name{font-size:12px;font-weight:700;color:#1E293B}
.ch-platform{font-size:10px;color:#64748B}
.ch-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
.time-input{border:1px solid #E2E8F0;border-radius:6px;padding:5px 8px;font-size:12px;font-family:Arial,sans-serif;color:#1E293B;background:#fff;width:90px}
.time-input:disabled{opacity:0.3;background:#F8FAFC}
.toggle-wrap{display:flex;align-items:center;gap:5px}
.tog-label{font-size:10px;color:#64748B;min-width:20px}
.toggle{position:relative;width:34px;height:18px;cursor:pointer;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;background:#E2E8F0;border-radius:18px;transition:background 0.2s}
.slider:before{content:'';position:absolute;width:14px;height:14px;left:2px;top:2px;background:#fff;border-radius:50%;transition:transform 0.2s}
.toggle input:checked+.slider{background:#185FA5}
.toggle input:checked+.slider:before{transform:translateX(16px)}
.modal-footer{padding:14px 20px;border-top:0.5px solid #F1F5F9;display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.btn-cancel{font-size:12px;padding:8px 16px;border-radius:8px;border:0.5px solid #CBD5E1;cursor:pointer;background:#fff;color:#475569;font-family:Arial,sans-serif;font-weight:600}
.btn-remove{font-size:12px;padding:8px 16px;border-radius:8px;border:1px solid #FCA5A5;cursor:pointer;background:#fff;color:#991B1B;font-family:Arial,sans-serif;font-weight:600}
.btn-save{font-size:12px;padding:8px 20px;border-radius:8px;border:none;cursor:pointer;background:#185FA5;color:#fff;font-family:Arial,sans-serif;font-weight:700}
.btn-save:disabled{opacity:0.35;cursor:default}
</style>
</head>
<body>
<div class="page-title">Guy Pistone — Content Calendar</div>
<p class="page-sub">Mon · Wed · Thu · Fri &nbsp;|&nbsp; All channels · Shared in real time</p>
<div class="sync-bar">
  <span class="sync-status loading" id="sync-status">Cargando...</span>
  <button class="btn-sync" onclick="loadData()">&#8635; Refrescar</button>
</div>
<div class="stats">
  <div class="stat"><div class="stat-n" id="s-sched">0</div><div class="stat-l">Programados</div></div>
  <div class="stat"><div class="stat-n" id="s-rem">57</div><div class="stat-l">Restantes</div></div>
  <div class="stat"><div class="stat-n" id="s-wks">0</div><div class="stat-l">Semanas</div></div>
  <div class="stat"><div class="stat-n">4x</div><div class="stat-l">Posts / semana</div></div>
</div>
<div class="legend">
  <div class="leg"><div class="leg-dot" style="background:#85B7EB"></div>AI Industry</div>
  <div class="leg"><div class="leg-dot" style="background:#97C459"></div>Valere</div>
  <div class="leg"><div class="leg-dot" style="background:#EF9F27"></div>AI Sectors</div>
  <div class="leg"><div class="leg-dot" style="background:#ED93B1"></div>Personal</div>
  <div class="leg"><div class="leg-dot" style="background:#AFA9EC"></div>Philosophy</div>
  <div class="leg"><div class="leg-dot" style="background:#5DCAA5"></div>Leadership</div>
</div>
<div class="top-bar">
  <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
  <div class="month-label" id="month-label"></div>
  <button class="nav-btn" onclick="changeMonth(1)">&#8594;</button>
  <button class="reset-btn" onclick="resetAll()">&#8635; Reset</button>
</div>
<div class="cal-grid" id="cal-grid"></div>
<div id="modal-area"></div>
<script>
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbyuuSszMnS2_fbWa1ekU5VrBPmozzXOPv5rR_Q4_n74rgvgMEgQxR69vvDh_keJvh0S/exec';
var PILLARS=[{id:'p1',label:'01 AI Industry & Trends',bg:'#E6F1FB',fg:'#0C447C',border:'#85B7EB'},{id:'p2',label:'02 Valere / Company',bg:'#EAF3DE',fg:'#27500A',border:'#97C459'},{id:'p3',label:'03 AI in Sectors',bg:'#FAEEDA',fg:'#633806',border:'#EF9F27'},{id:'p4',label:'04 Personal Story',bg:'#FBEAF0',fg:'#72243E',border:'#ED93B1'},{id:'p5',label:'05 AI Philosophy',bg:'#EEEDFE',fg:'#3C3489',border:'#AFA9EC'},{id:'p6',label:'06 Business Leadership',bg:'#E1F5EE',fg:'#085041',border:'#5DCAA5'}];
var CHANNELS=[{id:'tiktok',name:'TikTok',platform:'TikTok',icon:'TK',iconBg:'#000',iconColor:'#fff',def:'19:00'},{id:'fbig',name:'Facebook & Instagram',platform:'FB/IG',icon:'FI',iconBg:'#1877F2',iconColor:'#fff',def:'10:00'},{id:'x',name:'X (Twitter)',platform:'X',icon:'X',iconBg:'#111',iconColor:'#fff',def:'09:00'}];
var POSTING_DAYS=[1,3,4,5];
var DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
var today=new Date(),viewYear=today.getFullYear(),viewMonth=today.getMonth();
var assignments={},modalDate=null,draft={};

function freshChannels(){var c={};CHANNELS.forEach(function(ch){c[ch.id]={enabled:true,time:ch.def};});return c;}
function getPillar(id){return PILLARS.filter(function(p){return p.id===id;})[0];}
function setStatus(msg,type){var el=document.getElementById('sync-status');el.textContent=msg;el.className='sync-status '+type;}
function updateStats(){var n=Object.keys(assignments).length;document.getElementById('s-sched').textContent=n;document.getElementById('s-rem').textContent=57-n;document.getElementById('s-wks').textContent=Math.ceil(n/4)||0;}

function jsonpLoad(){
  return new Promise(function(resolve,reject){
    var cb='cb_'+Date.now();
    var s=document.createElement('script');
    var timer=setTimeout(function(){cleanup();reject(new Error('timeout'));},10000);
    window[cb]=function(data){cleanup();resolve(data);};
    function cleanup(){clearTimeout(timer);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
    s.onerror=function(){cleanup();reject(new Error('error'));};
    s.src=SCRIPT_URL+'?action=load&callback='+cb;
    document.head.appendChild(s);
  });
}

function postData(payload){
  return fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)}).catch(function(){});
}

function loadData(){
  setStatus('Cargando...','loading');
  jsonpLoad().then(function(data){
    if(data.ok){assignments=data.entries||{};setStatus('Sincronizado','ok');}
    else{setStatus('Error','error');}
    renderCalendar();
  }).catch(function(){
    setStatus('Error — revisa la URL','error');
    renderCalendar();
  });
}

function renderCalendar(){
  var grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  DAY_NAMES.forEach(function(d,i){
    var h=document.createElement('div');
    h.className='day-hdr'+(POSTING_DAYS.indexOf(i)>=0?' posting':'');
    h.textContent=d;grid.appendChild(h);
  });
  var firstDay=new Date(viewYear,viewMonth,1).getDay();
  var daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();
  for(var i=0;i<firstDay;i++){var b=document.createElement('div');b.className='day-cell off-day';grid.appendChild(b);}
  for(var d=1;d<=daysInMonth;d++){
    var jsDay=new Date(viewYear,viewMonth,d).getDay();
    var isPosting=POSTING_DAYS.indexOf(jsDay)>=0;
    var key=viewYear+'-'+String(viewMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var assigned=assignments[key];
    var isToday=(today.getFullYear()===viewYear&&today.getMonth()===viewMonth&&today.getDate()===d);
    if(!isPosting){
      var cell=document.createElement('div');cell.className='day-cell off-day';
      var n=document.createElement('div');n.className='day-num';n.textContent=d;
      cell.appendChild(n);grid.appendChild(cell);continue;
    }
    var cell=document.createElement('div');
    cell.className='day-cell posting-day'+(assigned?' has-content':'');
    if(assigned){var p=getPillar(assigned.pillarId);if(p)cell.style.background=p.bg+'CC';}
    (function(k,dd){cell.onclick=function(){openModal(k,dd);};})(key,d);
    var numEl=document.createElement('div');
    numEl.className='day-num'+(isToday?' today-circle':' active-num');
    numEl.textContent=d;cell.appendChild(numEl);
    if(assigned){
      var p=getPillar(assigned.pillarId);
      if(p){
        var slot=document.createElement('div');slot.className='slot';slot.style.color=p.fg;
        var pl=document.createElement('div');pl.className='slot-pillar';pl.textContent=p.label;slot.appendChild(pl);
        if(assigned.copy){var cp=document.createElement('div');cp.className='slot-copy';cp.textContent=assigned.copy;slot.appendChild(cp);}
        var chs=document.createElement('div');chs.className='slot-channels';
        CHANNELS.forEach(function(ch){
          if(assigned.channels&&assigned.channels[ch.id]&&assigned.channels[ch.id].enabled){
            var bx=document.createElement('div');bx.className='slot-ch';bx.style.color=p.fg;
            bx.textContent=(ch.id==='fbig'?'FB/IG':ch.name)+' '+assigned.channels[ch.id].time;
            chs.appendChild(bx);
          }
        });
        slot.appendChild(chs);cell.appendChild(slot);
      }
    } else {
      var ab=document.createElement('div');ab.className='add-btn';ab.textContent='+ Schedule';cell.appendChild(ab);
    }
    grid.appendChild(cell);
  }
  document.getElementById('month-label').textContent=MONTH_NAMES[viewMonth]+' '+viewYear;
  updateStats();
}

function openModal(key,day){
  modalDate=key;
  var ex=assignments[key];
  draft=ex?{pillarId:ex.pillarId,copy:ex.copy||'',channels:JSON.parse(JSON.stringify(ex.channels||freshChannels()))}:{pillarId:null,copy:'',channels:freshChannels()};
  renderModal(day);
}

function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderModal(day){
  var ex=assignments[modalDate];
  var jsDay=new Date(viewYear,viewMonth,day).getDay();
  var dayLabel=DAY_NAMES[jsDay]+', '+MONTH_NAMES[viewMonth]+' '+day+', '+viewYear;
  var html='<div class="overlay" id="overlay" onclick="overlayClick(event)"><div class="modal"><div class="modal-header"><div class="modal-date-label">Posting Day</div><div class="modal-heading">'+dayLabel+'</div></div><div class="modal-body"><div class="sec-label">1 - Content pillar</div><div class="pillar-grid">';
  PILLARS.forEach(function(pp){
    var isSel=draft.pillarId===pp.id;
    html+='<button class="pb'+(isSel?' sel':'')+'" style="'+(isSel?'background:'+pp.bg+';color:'+pp.fg+';border-color:'+pp.border:'')+'" onclick="selectPillar(\''+pp.id+'\','+day+')">'+pp.label+'</button>';
  });
  html+='</div>';
  if(draft.pillarId){
    html+='<div class="sec-label">2 - Content copy</div><textarea class="copy-area" id="copy-ta" placeholder="Write or paste your content copy here..." oninput="syncCopy(this.value)">'+escHtml(draft.copy)+'</textarea><div class="char-count" id="char-count">'+draft.copy.length+' characters</div><div class="sec-label">3 - Publishing time per channel</div>';
    CHANNELS.forEach(function(ch){
      var chData=draft.channels[ch.id]||{enabled:true,time:ch.def};
      html+='<div class="ch-row"><div class="ch-info"><div class="ch-icon" style="background:'+ch.iconBg+';color:'+ch.iconColor+'">'+ch.icon+'</div><div><div class="ch-name">'+ch.name+'</div><div class="ch-platform">'+ch.platform+'</div></div></div><div class="ch-controls"><input type="time" class="time-input" value="'+chData.time+'" '+(chData.enabled?'':'disabled')+' onchange="updateTime(\''+ch.id+'\',this.value)"><div class="toggle-wrap"><span class="tog-label">'+(chData.enabled?'On':'Off')+'</span><label class="toggle"><input type="checkbox" '+(chData.enabled?'checked':'')+' onchange="toggleCh(\''+ch.id+'\',this.checked,'+day+')"><span class="slider"></span></label></div></div></div>';
    });
  }
  html+='</div><div class="modal-footer"><button class="btn-cancel" onclick="closeModal()">Cancel</button>'+(ex?'<button class="btn-remove" onclick="removeSlot()">Remove</button>':'')+'<button class="btn-save" onclick="saveSlot()" '+(draft.pillarId?'':'disabled')+'>Save</button></div></div></div>';
  document.getElementById('modal-area').innerHTML=html;
}

function overlayClick(e){if(e.target.id==='overlay')closeModal();}
function selectPillar(pid,day){draft.pillarId=pid;renderModal(day);}
function syncCopy(v){draft.copy=v;var cc=document.getElementById('char-count');if(cc)cc.textContent=v.length+' characters';}
function updateTime(chId,v){if(draft.channels[chId])draft.channels[chId].time=v;}
function toggleCh(chId,en,day){if(draft.channels[chId])draft.channels[chId].enabled=en;renderModal(day);}

function saveSlot(){
  if(!draft.pillarId)return;
  var ta=document.getElementById('copy-ta');if(ta)draft.copy=ta.value;
  var entry={pillarId:draft.pillarId,copy:draft.copy,channels:JSON.parse(JSON.stringify(draft.channels))};
  assignments[modalDate]=entry;
  closeModal();renderCalendar();
  setStatus('Guardando...','loading');
  postData({action:'save',dateKey:modalDate,pillarId:entry.pillarId,copy:entry.copy,channels:entry.channels});
  setTimeout(function(){
    jsonpLoad().then(function(d){if(d.ok){assignments=d.entries||{};renderCalendar();}setStatus('Guardado','ok');}).catch(function(){setStatus('Guardado','ok');});
  },2000);
}

function removeSlot(){
  var key=modalDate;delete assignments[key];
  closeModal();renderCalendar();
  postData({action:'remove',dateKey:key});
  setStatus('Eliminado','ok');
}

function closeModal(){document.getElementById('modal-area').innerHTML='';modalDate=null;}
function changeMonth(dir){viewMonth+=dir;if(viewMonth>11){viewMonth=0;viewYear++;}if(viewMonth<0){viewMonth=11;viewYear--;}renderCalendar();}

function resetAll(){
  if(confirm('Resetear TODO el contenido? No se puede deshacer.')){
    assignments={};renderCalendar();
    postData({action:'reset'});
    setStatus('Reset exitoso','ok');
  }
}

loadData();
</script>
</body>
</html>
